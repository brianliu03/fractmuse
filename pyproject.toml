[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fractmuse"
version = "0.1.0"
description = "Algorithmic composition tools built around motifs, sieves, and Markov chains."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mido>=1.3.3,<2",
]

[project.optional-dependencies]
playback = [
    "mido[ports-rtmidi]>=1.3.3,<2",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
fractmuse = "fractmuse.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["fractmuse"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
